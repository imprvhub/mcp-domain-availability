[project]
name = "mcp-domain-availability"
version = "0.2.0"
description = "MCP server for checking domain availability across multiple TLDs via RDAP"
readme = "README.md"
requires-python = ">=3.10"
license = "MPL-2.0"
keywords = ["mcp", "model-context-protocol", "domain", "rdap", "whois", "availability"]
dependencies = [
    "mcp[cli]>=2.2.0",
    "dnspython>=2.8.0",
]

[[project.authors]]
name = "Iván Luna"
email = "contact@ivanluna.dev"

[project.urls]
Homepage = "https://github.com/imprvhub/mcp-domain-availability"
Repository = "https://github.com/imprvhub/mcp-domain-availability"
Issues = "https://github.com/imprvhub/mcp-domain-availability/issues"

[project.scripts]
mcp-domain-availability = "mcp_domain_availability.main:run"
mcp-domain-availability-cli = "mcp_domain_availability.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_domain_availability"]
