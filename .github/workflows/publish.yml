name: Publish container image

# Only on a tagged release, or by hand. This used to run on every push to main,
# which republished :latest for unrelated commits.
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-docker-image:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lower-case the repository name
        run: echo "REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push
        run: |
          TAG="${{ github.event_name == 'release' && github.event.release.tag_name || 'latest' }}"
          docker build . --tag "ghcr.io/${REPO}:${TAG}" --tag "ghcr.io/${REPO}:latest"
          docker push "ghcr.io/${REPO}:${TAG}"
          docker push "ghcr.io/${REPO}:latest"
